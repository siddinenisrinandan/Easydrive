spring.application.name=driveease
# Render (and most clouds) pass the port in the PORT environment variable
server.port=${PORT:8080}

# ---------- Database (H2 file DB, stored in ./data) ----------
spring.datasource.url=jdbc:h2:file:./data/driveease;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------- JSON ----------
spring.jackson.serialization.write-dates-as-timestamps=false

# ---------- Admin login (change before deploying!) ----------
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}

# ---------- AI assistant ----------
# Leave the key empty to use the built-in offline assistant (free).
# Set environment variable ANTHROPIC_API_KEY to switch the assistant to Claude.
app.ai.anthropic-api-key=${ANTHROPIC_API_KEY:}
app.ai.model=claude-opus-5-5
