<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout - DriveEase</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header id="site-header"></header>

<div class="container section" style="padding-top:26px">
  <div class="stepper" id="stepper">
    <div class="s" data-step="1"><i>1</i>Trip & price</div>
    <div class="s" data-step="2"><i>2</i>Traveller details</div>
    <div class="s" data-step="3"><i>3</i>Payment</div>
    <div class="s" data-step="4"><i>4</i>Confirmed</div>
  </div>
  <div class="detail-grid">
    <div id="main"><div class="spinner"></div></div>
    <aside class="sticky"><div class="card" id="summary"><div class="spinner"></div></div></aside>
  </div>
</div>

<footer id="site-footer"></footer>
<script src="/js/common.js"></script>
<script src="/js/checkout.js"></script>
</body>
</html>
