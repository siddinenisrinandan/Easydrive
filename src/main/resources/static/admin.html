<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Console - DriveEase</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header id="site-header"></header>

<div class="container section" style="padding-top:26px">
  <form class="card hidden" id="admin-login" style="max-width:420px;margin:40px auto">
    <h2>🔐 Admin console</h2>
    <p class="muted small">Operations team login. Default: <b>admin</b> / <b>admin123</b> (change in application.properties).</p>
    <div class="field"><label>Username</label><input id="a-user" value="admin" required></div>
    <div class="field"><label>Password</label><input type="password" id="a-pass" required></div>
    <button class="btn block" type="submit">Login</button>
  </form>

  <div class="admin-shell hidden" id="admin-app">
    <nav class="card admin-menu" id="admin-menu">
      <button data-view="overview" class="active">📊 Overview</button>
      <button data-view="bookings">📅 Bookings</button>
      <button data-view="live">📍 Live fleet</button>
      <button data-view="alerts">🚨 Alerts <span class="count hidden" id="alert-count"></span></button>
      <button data-view="vehicles">🚗 Fleet</button>
      <button data-view="drivers">🧑‍✈️ Drivers</button>
      <button data-view="customers">👥 Customers</button>
      <button data-view="payments">💳 Payments</button>
      <button id="admin-logout">↩ Logout</button>
    </nav>
    <main id="admin-view"><div class="spinner"></div></main>
  </div>
</div>

<footer id="site-footer"></footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="/js/common.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
